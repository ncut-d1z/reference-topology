[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reference-topology"
version = "0.1.0"
description = "A local PDF and citation graph workbench with traceable reference evidence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "starlette==1.10.0",
  "python-multipart==0.0.32",
  "pypdf==6.10.0",
  "pdfminer.six==20251230",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx==0.28.1", "reportlab==4.4.9"]

[project.scripts]
reference-topology = "reference_topology.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reference_topology = ["static/*", "static/vendor/*", "migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
