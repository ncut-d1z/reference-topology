name: Windows launcher smoke test

on:
  pull_request:
  push:
    branches:
      - feat/local-reference-workbench

jobs:
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Windows PowerShell 5.1 syntax and ASCII
        shell: powershell
        run: |
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path .\run.ps1).Path)
          if ($bytes | Where-Object { $_ -gt 127 }) { throw 'run.ps1 must be ASCII for PowerShell 5.1' }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\run.ps1).Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.ToString() }
            throw 'run.ps1 syntax errors'
          }
          if (-not (Select-String -Path .\run.ps1 -Pattern 'https://pypi.tuna.tsinghua.edu.cn/simple' -SimpleMatch)) {
            throw 'TUNA mirror is missing'
          }
      - name: First launch and repeat startup on Windows PowerShell 5.1
        shell: powershell
        run: |
          .\run.ps1 --check
          if ($LASTEXITCODE -ne 0) { throw 'first check failed' }
          .\run.ps1 --check
          if ($LASTEXITCODE -ne 0) { throw 'repeat check failed' }
      - name: Preserve an existing incompatible virtual environment
        shell: powershell
        run: |
          Rename-Item -LiteralPath .venv -NewName .venv-py312
          New-Item -ItemType Directory -Path .venv | Out-Null
          Set-Content -LiteralPath .venv\sentinel.txt -Value 'original environment'
          .\run.ps1 --check
          if ($LASTEXITCODE -ne 0) { throw 'isolated environment check failed' }
          if ((Get-Content -LiteralPath .venv\sentinel.txt -Raw).Trim() -ne 'original environment') {
            throw 'existing environment has been modified'
          }
      - name: Check PowerShell 7
        shell: pwsh
        run: |
          .\run.ps1 --check
          if ($LASTEXITCODE -ne 0) { throw 'pwsh check failed' }
